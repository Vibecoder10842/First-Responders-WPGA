<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Responder Field Drills</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f6ff;--bg2:#e3e8ff;--card:#fff;--soft:#eef0ff;--ink:#0f172a;--mute:#64748b;--acc:#4f46e5;--on:#fff;--ok:#15803d;--bad:#b91c1c;--opt:#f1f4fb;--sh:0 1px 2px rgba(15,23,42,.06),0 10px 28px rgba(79,70,229,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--bg2:#161d40;--card:#151b30;--soft:#1e2547;--ink:#e8ecf8;--mute:#98a2c0;--acc:#818cf8;--on:#0b1020;--ok:#22c55e;--bad:#ef4444;--opt:#1d2440;--sh:none}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg2),var(--bg) 380px) no-repeat var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 24px 80px}
h1{font-size:2rem;margin:.5em 0 .2em}h2{font-size:1.3rem;margin:1.8em 0 .6em}h3{font-size:1.1rem;margin:.2em 0}p{margin:.4em 0}
button,input{font:inherit;color:inherit}
input{width:100%;padding:12px 14px;margin:6px 0 12px;border:0;border-radius:10px;background:var(--opt)}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 22px;background:var(--acc);color:var(--on);font-weight:700}
button.quiet{background:var(--soft);color:var(--acc)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.link{color:var(--acc);text-decoration:underline;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top{padding:6px 0 14px}
.tabs{display:flex;gap:20px;margin:10px 0 18px;flex-wrap:wrap}.tabs .link.on{font-weight:700;text-decoration-thickness:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{background:var(--card);border-radius:16px;padding:22px;box-shadow:var(--sh)}
.card.done{background:var(--soft);box-shadow:none}
.card button{margin-top:10px}
.narrow{max-width:420px;margin:9vh auto 0}
.quiz{max-width:780px;margin:0 auto}
.row{background:var(--card);border-radius:12px;padding:14px 18px;margin:8px 0;box-shadow:var(--sh)}
.chk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--on);font-size:.85rem;margin-right:8px}
.duetag{color:var(--acc)}
.tag{display:inline-block;background:#fde68a;color:#422006;border-radius:6px;padding:1px 9px;margin:0 6px 4px 0;font-size:.85rem;font-style:italic}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--opt);color:var(--ink);font-weight:400;margin:10px 0;padding:16px 18px;border:2px solid transparent;border-radius:12px}
.opt:disabled{cursor:default;opacity:1;color:var(--ink)}
.opt .ic{width:22px;flex:none;font-weight:700;font-size:1.2rem;text-align:center}
.opt.right{border:2px solid var(--ok)}.opt.right .ic{color:var(--ok)}
.opt.wrong{border:2px solid var(--bad)}.opt.wrong .ic{color:var(--bad)}
.opt.reveal{border:2px dotted var(--ok)}
.meter{height:10px;border-radius:5px;background:var(--bg);margin-top:10px;overflow:hidden}.meter i{display:block;height:100%;background:var(--acc)}.meter.bad i{background:var(--bad)}
.note{background:var(--card);border-radius:12px;padding:12px 18px;margin:0 0 16px}.note summary{cursor:pointer;font-weight:700;color:var(--acc)}
.mute{color:var(--mute)}.err{color:var(--bad);font-weight:700}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px 6px}th{color:var(--mute);font-weight:400;font-style:italic}
</style>
</head>
<body><main id="app"></main>
<script>
const SUPABASE_URL = 'https://dkcbviodzadcktruachk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_wB_p-1Sf2QaOgWsKEZoRfg_Mpc4iHP6';
const DOMAIN = 'frt-pilot.example.com';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tags = a => (a || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
const fmt = d => d ? new Date(d).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : 'never';
let me, mods = [], qs = [], due = [];

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return login();
  const { data } = await sb.from('profiles').select('code,role').single();
  if (!data) { await sb.auth.signOut(); return login('Account not found.'); }
  me = data;
  me.role === 'teacher' ? teacher('vector') : student();
}

function login(msg = '', first = false) {
  $.innerHTML = `<div class="card narrow"><h1>Field Drills</h1><p class="mute">Sign in with the code your instructor gave you. No name or email needed.</p>
  <label>Your code<input id="c" autocomplete="username" autocapitalize="characters" placeholder="FR-XXXX-XXXX"></label>
  <label>${first ? 'Choose a password (8+ characters)' : 'Password'}<input id="p" type="password" autocomplete="${first ? 'new-password' : 'current-password'}"></label>
  <p class="err" role="alert">${esc(msg)}</p>
  <button id="go">${first ? 'Create account' : 'Sign in'}</button>
  <p><span class="link" id="sw">${first ? 'I already have an account' : 'First time? Set a password'}</span></p></div>`;
  document.getElementById('sw').onclick = () => login('', !first);
  document.getElementById('go').onclick = async () => {
    const code = document.getElementById('c').value.trim().toUpperCase(), password = document.getElementById('p').value;
    if (!code) return login('Enter your code.', first);
    if (first && password.length < 8) return login('Password needs 8 or more characters.', first);
    const cred = { email: `${code.toLowerCase()}@${DOMAIN}`, password };
    const { data, error } = first ? await sb.auth.signUp(cred) : await sb.auth.signInWithPassword(cred);
    if (error) return login(first ? 'That code is invalid or already used. Ask your instructor.' : 'Code or password is incorrect.', first);
    if (!data.session) return login('Sign-up succeeded but email confirmation is still on in Supabase.', first);
    boot();
  };
}

const bar = who => `<div class="bar top"><b>Field Drills <span class="mute">/ ${esc(who)}</span></b><span class="link" onclick="out()">Sign out</span></div>`;
async function out() { await sb.auth.signOut(); location.reload(); }

async function student() {
  const [m, q, r, a] = await Promise.all([
    sb.from('modules').select('*').order('id'), sb.from('questions').select('*').order('module_id').order('step_no'),
    sb.from('review_state').select('question_id,box,due_at'), sb.from('access_log').select('*').order('created_at', {ascending:false}).limit(10)]);
  mods = m.data || []; qs = q.data || [];
  const rs = Object.fromEntries((r.data || []).map(x => [x.question_id, x]));
  due = (r.data || []).filter(x => new Date(x.due_at) <= new Date()).map(x => x.question_id);
  const info = mods.map(x => {
    const s = qs.filter(y => y.module_id === x.id), seen = s.filter(y => rs[y.id]);
    return { ...x, n: s.length, seen: seen.length, done: s.length > 0 && seen.length === s.length,
      mastery: Math.round(100 * s.reduce((t, y) => t + (rs[y.id]?.box || 0), 0) / (5 * (s.length || 1))),
      due: s.filter(y => due.includes(y.id)).length, next: seen.map(y => rs[y.id].due_at).sort()[0] };
  });
  const todo = x => `<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.scenario)}</p><p class="mute"><i>About ${Math.round(x.est_seconds / 6) / 10} min. ${x.seen} of ${x.n} steps attempted.</i></p><button class="go" data-m="${x.id}">${x.seen ? 'Continue' : 'Start'}</button></div>`;
  const fin = x => `<div class="card done"><h3><span class="chk">&#10003;</span>${esc(x.title)}</h3><p class="mute"><i>${x.kind === 'call' ? 'Mock call' : 'Knowledge quiz'}</i></p><div class="meter"><i style="width:${x.mastery}%"></i></div><p class="mute"><i>Mastery ${x.mastery}%. ${x.due ? `<b class="duetag">${x.due} due for review.</b> ` : ''}Next review: ${fmt(x.next)}.</i></p><button class="go quiet" data-m="${x.id}" data-all="1">Practice again</button></div>`;
  const sec = (t, l, f, e) => `<h2>${t}</h2>${l.length ? `<div class="grid">${l.map(f).join('')}</div>` : `<p class="mute">${e}</p>`}`;
  $.innerHTML = `${bar('Code ' + me.code)}<h1>Today</h1>
  <div class="card"><b>${due.length}</b> question${due.length === 1 ? '' : 's'} due for review.
  ${due.length ? `<p><button id="rv">Review now</button></p>` : `<p class="mute">Nothing due. Missed questions come back here on a schedule.</p>`}</div>
  ${sec('Mock calls', info.filter(x => x.kind === 'call' && !x.done), todo, 'All mock calls finished.')}
  ${sec('Knowledge quizzes', info.filter(x => x.kind === 'knowledge' && !x.done), todo, 'All knowledge quizzes finished.')}
  <h2>Done</h2>
  <details class="note"><summary>How review scheduling works</summary>
  <p>This is <b>spaced repetition</b>, built on the spacing effect and Ebbinghaus's forgetting curve (1880s): memory fades quickly unless you revisit material at widening intervals. The box schedule used here is the <b>Leitner system</b> (1970s). A miss returns in about 10 minutes. Correct answers return after 1, 3, 7, 14, then 30 days. A miss at any point sends the question back to the start. It works through <b>active recall</b>: pulling the answer from memory instead of rereading it.</p></details>
  ${info.some(x => x.done) ? `<div class="grid">${info.filter(x => x.done).map(fin).join('')}</div>` : '<p class="mute">Finished modules appear here with a mastery meter.</p>'}
  ${(a.data || []).length ? `<h2>Who looked at your record</h2>${a.data.map(l => `<p><i>${fmt(l.created_at)}</i>: ${esc(l.reason)}</p>`).join('')}` : ''}`;
  document.querySelectorAll('.go').forEach(b => b.onclick = () => {
    const s = qs.filter(y => y.module_id === b.dataset.m), left = s.filter(y => !rs[y.id]);
    run(b.dataset.all || !left.length ? s : left);
  });
  const rv = document.getElementById('rv'); if (rv) rv.onclick = () => run(qs.filter(y => due.includes(y.id)).slice(0, 5));
}

function run(queue, i = 0, score = 0) {
  if (i >= queue.length) { $.innerHTML = `${bar('Code ' + me.code)}<div class="quiz card"><h1>Done</h1><p>${score} of ${queue.length} correct. Missed steps return in 10 minutes; correct ones come back after a day, then spread out.</p><p><button id="h">Back to today</button></p></div>`; return document.getElementById('h').onclick = student; }
  const q = queue[i], m = mods.find(x => x.id === q.module_id);
  const opts = q.options.map((t, k) => ({ t, k })).sort(() => Math.random() - .5);
  $.innerHTML = `${bar(m.title)}<div class="quiz"><p class="mute"><i>Step ${i + 1} of ${queue.length}</i></p>
  <h2>${esc(q.prompt)}</h2><div id="o">${opts.map(o => `<button class="opt" data-k="${o.k}"><span class="ic"></span><span>${esc(o.t)}</span></button>`).join('')}</div><div id="fb"></div></div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
    document.querySelectorAll('.opt').forEach(x => x.disabled = true);
    const { data, error } = await sb.rpc('submit_answer', { p_question: q.id, p_choice: +b.dataset.k });
    if (error) return document.getElementById('fb').innerHTML = `<p class="err">${esc(error.message)}</p>`;
    document.querySelectorAll('.opt').forEach(x => {
      const ic = x.querySelector('.ic');
      if (+x.dataset.k === data.correct_index) { x.classList.add(x === b ? 'right' : 'reveal'); if (x === b) ic.textContent = '\u2713'; }
      else if (x === b) { x.classList.add('wrong'); ic.textContent = '\u2715'; }
    });
    document.getElementById('fb').innerHTML = `<div class="card"><p><b>${data.correct ? 'Correct.' : 'Not this time.'}</b> ${esc(data.rationale)}</p><p class="mute"><i>Next review: ${fmt(data.due_at)}</i></p><button id="nx">${i + 1 < queue.length ? 'Next step' : 'Finish'}</button></div>`;
    document.getElementById('nx').onclick = () => run(queue, i + 1, score + (data.correct ? 1 : 0));
  });
}

async function teacher(tab) {
  $.innerHTML = `${bar('Instructor ' + me.code)}<h1>Competency vector</h1>
  <div class="tabs">${[['vector','Team weaknesses'],['drill','Student lookup'],['codes','Codes'],['log','Access log']].map(([k, l]) => `<span class="link ${k === tab ? 'on' : ''}" data-t="${k}">${l}</span>`).join('')}</div><div id="v">Loading...</div>`;
  document.querySelectorAll('[data-t]').forEach(x => x.onclick = () => teacher(x.dataset.t));
  const v = document.getElementById('v');
  if (tab === 'vector') {
    const { data, error } = await sb.rpc('competency_vector');
    if (error) return v.innerHTML = `<p class="err">${esc(error.message)}</p>`;
    let lk = '', lm = '';
    v.innerHTML = `<p class="mute"><i>Share of students whose most recent attempt at each step was wrong. Individuals are not shown.</i></p>` + data.map(r => {
      let h = '';
      if (r.module_kind !== lk) { lk = r.module_kind; lm = ''; h += `<h2>${lk === 'call' ? 'Mock calls' : 'Knowledge quizzes'}</h2>`; }
      if (r.module_id !== lm) { lm = r.module_id; h += `<h3>${esc(r.module_title)}</h3>`; }
      return h + `<div class="row"><div class="bar"><b>Step ${r.step_no}: ${esc(r.step_label)}</b><span>${r.fail_pct === null ? '<i class="mute">no data</i>' : `<b>${r.fail_pct}%</b> fail <i class="mute">(${r.students} students)</i>`}</span></div>${tags(r.chaos)}<div class="meter bad"><i style="width:${r.fail_pct || 0}%"></i></div></div>`; }).join('');
  } else if (tab === 'drill') {
    v.innerHTML = `<p>Viewing one student is a logged action. The reason you enter is stored and shown to that student.</p>
    <label>Student code<input id="dc" autocapitalize="characters"></label><label>Reason<input id="dr" placeholder="e.g. 1:1 coaching before competition"></label>
    <button id="dg">View and log</button><div id="dres"></div>`;
    document.getElementById('dg').onclick = async () => {
      const { data, error } = await sb.rpc('student_drilldown', { p_code: document.getElementById('dc').value, p_reason: document.getElementById('dr').value });
      document.getElementById('dres').innerHTML = error ? `<p class="err">${esc(error.message)}</p>` :
        `<h2>${esc(document.getElementById('dc').value.toUpperCase())}</h2><table><tr><th>Step</th><th>Attempts</th><th>Latest</th><th>Next due</th></tr>${data.map(r => `<tr><td>${esc(r.module_title)}, step ${r.step_no}: ${esc(r.step_label)}</td><td>${r.n_attempts}</td><td>${r.last_correct === null ? '-' : r.last_correct ? 'correct' : '<b class="err">missed</b>'}</td><td>${r.due_at ? fmt(r.due_at) : '-'}</td></tr>`).join('')}</table>`;
    };
  } else if (tab === 'codes') {
    const { data } = await sb.from('issued_codes').select('code,role,claimed_at').order('created_at', {ascending:false});
    v.innerHTML = `<p>Codes are anonymous. Keep the code-to-student list offline only.</p><label>How many new student codes<input id="n" type="number" value="10" min="1" max="60"></label><button id="ic">Issue codes</button><div id="cr"></div>
    <table><tr><th>Code</th><th>Status</th></tr>${(data || []).map(c => `<tr><td>${esc(c.code)}${c.role === 'teacher' ? ' <i>(instructor)</i>' : ''}</td><td>${c.claimed_at ? 'claimed' : '<b>unused</b>'}</td></tr>`).join('')}</table>`;
    document.getElementById('ic').onclick = async () => { const { error } = await sb.rpc('issue_codes', { p_count: +document.getElementById('n').value });
      error ? document.getElementById('cr').innerHTML = `<p class="err">${esc(error.message)}</p>` : teacher('codes'); };
  } else {
    const { data } = await sb.from('access_log').select('*').order('created_at', {ascending:false}).limit(100);
    v.innerHTML = (data || []).length ? `<table><tr><th>When</th><th>Student</th><th>Reason</th></tr>${data.map(l => `<tr><td>${fmt(l.created_at)}</td><td>${esc(l.target_code)}</td><td>${esc(l.reason)}</td></tr>`).join('')}</table>` : '<p class="mute">No individual lookups yet.</p>';
  }
}
boot();
</script>
</body>
</html>
